async function loadRequestStatus() {
  send.disabled = true;
  input.disabled = true;
  status.textContent = "Caricamento richiesta…";

  try {
    const { data, error } = await supabaseClient
      .from("iban_change_requests")
      .select("id, status, created_at")
      .eq("employee_id", employeeId)
      .order("created_at", { ascending: false })
      .limit(1)
      .maybeSingle();

    if (error) throw error;

    const pending = data?.status === "pending";
    send.disabled = pending;
    input.disabled = pending;

    const labels = {
      pending: "Richiesta in attesa di approvazione.",
      approved: "Ultima richiesta approvata.",
      rejected: "Ultima richiesta rifiutata. Puoi inviarne una nuova."
    };
    status.textContent = data
      ? labels[data.status]
      : "Nessuna richiesta precedente.";
  } catch {
    status.textContent =
      "Impossibile verificare le richieste. Riapri questa pagina.";
  }
}

// IBAN_INVIO
    form.onsubmit = async (event) => {
  event.preventDefault();
  if (send.disabled) return;

  const iban = input.value.replace(/\s/g, "").toUpperCase();
  if (!/^[A-Z]{2}[0-9]{2}[A-Z0-9]{11,30}$/.test(iban)
      || (iban.startsWith("IT") && iban.length !== 27)) {
    status.textContent = "Controlla il formato IBAN.";
    return;
  }

  let remainder = 0;
  for (const character of iban.slice(4) + iban.slice(0, 4)) {
    const digits = /[A-Z]/.test(character)
      ? String(character.charCodeAt(0) - 55) : character;
    for (const digit of digits) {
      remainder = (remainder * 10 + Number(digit)) % 97;
    }
  }
  if (remainder !== 1) {
    status.textContent = "IBAN non valido. Controlla le cifre.";
    return;
  }

  send.disabled = true;
  input.disabled = true;
  status.textContent = "Invio in corso…";

  try {
    const { error } = await supabaseClient
      .from("iban_change_requests")
      .insert({
        employee_id: employeeId,
        requested_iban: iban
      });
    if (error) throw error;

    input.value = "";
    input.type = "password";
    reveal.textContent = "Mostra IBAN";
    status.textContent = "Richiesta inviata. In attesa di approvazione.";
  } catch {
    await loadRequestStatus();
    if (!send.disabled) {
      status.textContent =
        "Invio non confermato. Controlla i dati prima di riprovare.";
    }
  }
};
await loadRequestStatus();

async function loadSiteAttendance() {
  const today = new Intl.DateTimeFormat("sv-SE", {
    timeZone: "Europe/Rome",
    year: "numeric",
    month: "2-digit",
    day: "2-digit"
  });
  const date = today.format(new Date());

  // Read a window that covers the whole Italian calendar day.
  const utcMidnight = Date.parse(`${date}T00:00:00Z`);
  const from = new Date(utcMidnight - 2 * 3600000).toISOString();
  const until = new Date(utcMidnight + 24 * 3600000).toISOString();

  const [sitesResult, assignmentsResult, eventsResult] = await Promise.all([
    supabaseClient.from("sites")
      .select("id, name").eq("active", true).order("name"),
    supabaseClient.from("employee_sites")
      .select("site_id, employee_id, employees(full_name, active)"),
    supabaseClient.from("attendance")
      .select("site_id, employee_id, event_type, event_time")
      .gte("event_time", from).lt("event_time", until)
      .in("event_type", ["check_in", "check_out"])
      .order("event_time", { ascending: false })
      .order("id", { ascending: false })
  ]);

  const error = sitesResult.error || assignmentsResult.error || eventsResult.error;
  if (error) throw error;

  const latest = new Map();
  for (const event of eventsResult.data) {
    if (today.format(new Date(event.event_time)) !== date) continue;
    const key = `${event.site_id}/${event.employee_id}`;
    if (!latest.has(key)) latest.set(key, event.event_type);
  }

  attendanceList.replaceChildren();
  if (!sitesResult.data.length) {
    attendanceList.textContent = "Nessun cantiere attivo.";
    return;
  }

  for (const site of sitesResult.data) {
    const heading = document.createElement("h4");
    heading.textContent = site.name;
    attendanceList.append(heading);

    const assigned = assignmentsResult.data.filter(
      row => row.site_id === site.id && row.employees?.active === true
    );
    if (!assigned.length) {
      const message = document.createElement("p");
      message.textContent = "Nessun dipendente attivo assegnato.";
      attendanceList.append(message);
      continue;
    }

    const list = document.createElement("ul");
    for (const row of assigned) {
      const event = latest.get(`${site.id}/${row.employee_id}`);
      const status = event === "check_in" ? "Check-out da fare"
        : event === "check_out" ? "Check-out registrato"
        : "Nessuna timbratura oggi";
      const item = document.createElement("li");
      item.textContent = `${row.employees.full_name || "Dipendente"} — ${status}`;
      list.append(item);
    }
    attendanceList.append(list);
  }
}

async function loadIbanReviews() {
  try {
    const { data: requests, error } = await supabaseClient
      .from("iban_change_requests")
      .select("id, employee_id, requested_iban, created_at")
      .eq("status", "pending")
      .order("created_at");

    if (error) throw error;

    reviewList.replaceChildren();
    if (!requests.length) {
      reviewList.textContent = "Nessuna richiesta in attesa.";
      return;
    }

    const { data: workers, error: workerError } =
      await supabaseClient.from("employees")
        .select("id, full_name");
    if (workerError) throw workerError;

    for (const request of requests) {
      const row = document.createElement("div");
      const name = document.createElement("p");
      const worker = workers.find(
        item => item.id === request.employee_id
      );
      name.textContent = worker?.full_name || "Dipendente";

      const iban = document.createElement("input");
      iban.type = "password";
      iban.readOnly = true;
      iban.value = request.requested_iban;
      iban.setAttribute("aria-label", "IBAN richiesto");

      const reveal = document.createElement("button");
      reveal.type = "button";
      reveal.textContent = "Mostra IBAN";
      reveal.onclick = () => {
        const show = iban.type === "password";
        iban.type = show ? "text" : "password";
        reveal.textContent = show ? "Nascondi IBAN" : "Mostra IBAN";
      };

      const message = document.createElement("p");
      message.setAttribute("role", "status");
      const approve = document.createElement("button");
      const reject = document.createElement("button");
      approve.type = reject.type = "button";
      approve.className = reject.className = "action";
      approve.textContent = "Approva";
      reject.textContent = "Rifiuta";

      async function review(accept) {
        if (approve.disabled) return;
        const question = accept
          ? "Approvare e sostituire l’IBAN del dipendente?"
          : "Rifiutare questa richiesta?";
        if (!confirm(question)) return;

        approve.disabled = reject.disabled = true;
        message.textContent = "Salvataggio...";
        try {
          const { error } = await supabaseClient.rpc(
            "review_iban_request",
            {
              p_request_id: request.id,
              p_approve: accept
            }
          );
          if (error) throw error;
        } catch {
          message.textContent =
            "Esito non confermato. Riapri Employees per verificare.";
          return;
        }

        await openPage("employees");
      }

      approve.onclick = () => review(true);
      reject.onclick = () => review(false);
      row.append(name, iban, reveal, approve, reject, message);
      reviewList.append(row);
    }
  } catch {
    reviewList.textContent =
      "Impossibile caricare le richieste. Riapri Employees.";
  }
}

  employeePicker.onchange = async () => {
    const version = ++bankLoadVersion;
    const employeeId = employeePicker.value;
    ibanInput.value = "";
    ibanInput.type = "password";
    revealButton.textContent = "Mostra IBAN";
    ibanInput.disabled = true;
    bankSave.disabled = true;
    revealButton.disabled = true;
    bankStatus.textContent = "";
    if (!employeeId) return;

    bankStatus.textContent = "Caricamento…";
    try {
      const { data, error } = await supabaseClient
        .from("employee_bank_details").select("iban")
        .eq("employee_id", employeeId).maybeSingle();
      if (version !== bankLoadVersion) return;
      if (error) throw error;

      ibanInput.value = data?.iban || "";
      bankStatus.textContent = data
        ? "IBAN registrato •••• " + data.iban.slice(-4)
        : "Nessun IBAN registrato.";
      ibanInput.disabled = false;
      bankSave.disabled = false;
      revealButton.disabled = false;
    } catch {
      if (version === bankLoadVersion) {
        bankStatus.textContent = "Impossibile caricare l’IBAN.";
      }
    }
  };

  revealButton.onclick = () => {
    const show = ibanInput.type === "password";
    ibanInput.type = show ? "text" : "password";

  bankForm.onsubmit = async (event) => {
    event.preventDefault();
    if (bankSave.disabled || !employeePicker.value) return;

    const iban = ibanInput.value.replace(/\s/g, "").toUpperCase();
    const italianLengthValid = !iban.startsWith("IT") || iban.length === 27;
    if (!/^[A-Z]{2}[0-9]{2}[A-Z0-9]{11,30}$/.test(iban)
        || !italianLengthValid) {
      bankStatus.textContent = "Controlla il formato IBAN.";
      return;
    }

    const rearranged = iban.slice(4) + iban.slice(0, 4);
    let remainder = 0;
    for (const character of rearranged) {
      const digits = /[A-Z]/.test(character)
        ? String(character.charCodeAt(0) - 55) : character;
      for (const digit of digits) {
        remainder = (remainder * 10 + Number(digit)) % 97;
      }
    }
    if (remainder !== 1) {
      bankStatus.textContent = "IBAN non valido. Controlla le cifre.";
      return;
    }

    employeePicker.disabled = true;
    bankSave.disabled = true;
    ibanInput.disabled = true;
    bankStatus.textContent = "Salvataggio…";

    try {
      const { error } = await supabaseClient
        .from("employee_bank_details")
        .upsert({
          employee_id: employeePicker.value,
          iban,
          updated_at: new Date().toISOString()
        }, { onConflict: "employee_id" })
        .select("employee_id").single();
      if (error) throw error;

      ibanInput.value = iban;
      ibanInput.type = "password";
      revealButton.textContent = "Mostra IBAN";
      bankStatus.textContent = "IBAN salvato •••• " + iban.slice(-4);
    } catch {
      bankStatus.textContent =
        "Salvataggio non confermato. Ricarica il dipendente prima di riprovare.";
    } finally {
      employeePicker.disabled = false;
      bankSave.disabled = false;
      ibanInput.disabled = false;
    }
  };

const toRad = n => n * Math.PI / 180;

const userLon = position.coords.longitude;

  if (!sites || sites.active !== true) return false;

    Math.cos(toRad(lat)) *
    Math.sin(dLon / 2) ** 2;

    Math.asin(Math.min(1, Math.sqrt(a)));

  return distance <= radius;
});

  async function showDocuments(employeeId) {

    list.replaceChildren();

    const privateTypes = [
      "Attestati di Formazione",
      "Certificati Medici",
      "Corso",
      "Medico"
    ];

    const visibleRecords = (records || []).filter(
      record => isAdmin ||
        !privateTypes.includes(record.document_type)
    );

    if (!visibleRecords.length) {
      list.textContent = "Nessun documento trovato.";
      return;
    }

    for (const record of visibleRecords) {
      const item = document.createElement("div");
      item.style.margin = "16px 0";
      item.style.padding = "10px";
      item.style.borderBottom = "1px solid #ddd";

      const name = document.createElement("p");
      name.textContent =
        (record.document_type || "Documento") +

      (record.document_name || "Documento PDF");

      item.appendChild(name);

      for (const action of [
        "Visualizza PDF",
        "Scarica PDF"
      ]) {
        const button = document.createElement("button");
        button.className = "action";
        button.textContent = action;

        button.onclick = async () => {
          button.disabled = true;

          try {
            const { data, error } =
              await supabaseClient.storage
                .from(bucket)
                .createSignedUrl(
                  record.file_path,
                  60,
                  {
                    download:
                      action === "Scarica PDF"
                  }
                );

            if (error) throw error;

            if (!data?.signedUrl) {
              throw new Error("Link PDF non disponibile.");
            }

            window.open(
              data.signedUrl,
              "_blank",
              "noopener"
            );
          } catch (error) {
            alert(
              "Errore apertura PDF: " +
              (error.message || String(error))
            );
          } finally {
            button.disabled = false;
          }
        };

        item.appendChild(button);
      }

      list.appendChild(item);
    }
  }

  if (isAdmin) {
    const typeSelect = document.createElement("select");
    typeSelect.style.margin = "8px";

      typeSelect.add(new Option(type, type));
    }

    content.insertBefore(typeSelect, list);

    const picker = document.createElement("input");

    uploadButton.onclick = () => {
      if (!employeeSelect.value) {
        alert("Seleziona prima un dipendente.");
        return;
      }

      picker.value = "";
      picker.click();
    };

    picker.onchange = async () => {
      const file = picker.files?.[0];
      if (!file) return;

      const employeeId = employeeSelect.value;

      if (!employeeId) {
        alert("Seleziona un dipendente.");
        return;
      }

      const isPdf =
        file.type === "application/pdf" ||
        file.name.toLowerCase().endsWith(".pdf");

      if (!isPdf) {
        alert("Seleziona soltanto file PDF.");
        return;
      }

      if (file.size > 10 * 1024 * 1024) {
        alert("Dimensione massima: 10 MB.");
        return;
      }

      uploadButton.disabled = true;
      uploadButton.textContent = "Caricamento...";
      message.textContent = "";

      try {
        const { data: sessionData, error: sessionError } =
          await supabaseClient.auth.getSession();

        if (sessionError) throw sessionError;

        if (!sessionData?.session) {
          throw new Error(
            "Sessione scaduta. Effettua nuovamente il login."
          );
        }

        const path =
          employeeId + "/" +
          crypto.randomUUID() + ".pdf";

        const { data: uploaded, error: uploadError } =
          await supabaseClient.storage
            .from(bucket)
            .upload(path, file, {
              contentType: "application/pdf",
              upsert: false
            });

        if (uploadError) throw uploadError;

        const { error: dbError } =
          await supabaseClient
            .from("employee_documents")
            .insert({
              employee_id: employeeId,
              document_type: typeSelect.value,
              document_name: file.name,
              file_path: uploaded?.path || path
            });

        if (dbError) {
          throw new Error(
            "PDF caricato nello Storage, ma dati non salvati: " +
            dbError.message
          );
        }

        message.textContent =
          "PDF caricato correttamente.";

        await showDocuments(employeeId);

      } catch (error) {
        const details =
          error?.message || String(error);

        console.error("HRS PDF upload error:", error);

        if (
          details.toLowerCase().includes("failed to fetch")
        ) {
          alert(

            "Controllare rete, browser o configurazione Storage. " +
            "Dettaglio: " + details

        } else {
          alert("Errore caricamento PDF: " + details);

      } finally {
        uploadButton.disabled = false;
        uploadButton.textContent = "Carica PDF";
      }
    };

    employeeSelect.onchange = () => {
      selectedEmployeeId = employeeSelect.value;

    list.textContent = "Seleziona un dipendente.";

      <input name="confirmPassword" type="password"
        placeholder="Conferma password" minlength="8"
        autocomplete="new-password" required>
    </p>
    <button class="action" type="submit">Salva password</button>
    <p role="status"></p>
  </form>
</section>

<script>
(() => {
  const box = document.getElementById("passwordResetBox");
  const form = document.getElementById("passwordResetForm");
  const button = form.querySelector("button");
  const status = form.querySelector('[role="status"]');

  function showReset() {
    for (const id of [
      "loginBox", "dashboard", "employeeDashboard", "page"
    ]) {
      const element = document.getElementById(id);
      if (element) element.style.display = "none";
    }
    box.style.display = "block";
  }

  supabaseClient.auth.onAuthStateChange((event) => {
    if (event === "PASSWORD_RECOVERY") showReset();
  });

  const recovery = new URLSearchParams(location.hash.slice(1));
  if (recovery.get("type") === "recovery") showReset();

  form.onsubmit = async (event) => {
    event.preventDefault();
    if (button.disabled) return;

    const password = form.elements.password.value;
    if (password !== form.elements.confirmPassword.value) {
      status.textContent = "Le password non coincidono.";
      return;
    }

    button.disabled = true;
    status.textContent = "Salvataggio...";
    try {
      const { error } = await supabaseClient.auth.updateUser({
        password
      });
      if (error) throw error;

      form.reset();
      status.textContent = "Password salvata. Riapri l’app e accedi.";
      await supabaseClient.auth.signOut({ scope: "local" });
      history.replaceState(null, "", location.pathname);
    } catch (error) {
      status.textContent = "Errore: " + error.message;
      button.disabled = false;
    }
  };
})();
</script>
</body>
</html>
