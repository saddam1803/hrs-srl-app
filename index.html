
<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HRS SRL App</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f3f6fa;
      margin: 0;
      text-align: center;
    }
    header {
      background: #102b50;
      color: white;
      padding: 30px 15px;
    }
    main { padding: 24px; }
    .card {
      background: white;
      margin: 12px auto;
      padding: 20px;
      max-width: 400px;
      border-radius: 12px;
      box-shadow: 0 2px 8px #ddd;
    }
  </style>
</head>
<body>
  <header>
    <h1>HRS SRL</h1>
    <p>Business Management App</p>
  </header>
  <main>
    <h2>Dashboard</h2>
    <div class="card">Employees</div>
    <div class="card">Construction Sites</div>
    <div class="card">GPS Attendance</div>
    <div class="card">Documents & Payslips</div>
    <div class="card">Customers & Invoices</div>
  </main>
</body>
</html>
