 <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  const SUPABASE_URL = "https://rklplljrumpbzkqstxpt.supabase.co";

 async function checkLogin() {
  const { data, error } = await supabaseClient.auth.getUser();

  <style>
    body {
      font-family: Arial, sans-serif;

</head>
<body>
  <section id="loginBox" class="panel" style="display:block;">
  <h2>HRS SRL Login</h2>

  <input
    type="email"
    id="loginEmail"
    placeholder="Email"
    autocomplete="username"
  >

  <input
    type="password"
    id="loginPassword"
    placeholder="Password"
    autocomplete="current-password"
  >

  <button class="action" onclick="loginUser()">
    Accedi / Login
  </button>

  <p id="loginMessage"></p>
</section>
  <header>
    <h1>HRS SRL</h1>
    <p>Business Management App</p>
  </header>

  <main>
    <section id="dashboard" style="display:none;">
      <h2>Dashboard</h2>
      <button class="card" onclick="openPage('employees')">
        Employees
      </button>
      <button class="card" onclick="openPage('sites')">
        Construction Sites
      </button>
      <button class="card" onclick="openPage('attendance')">
        GPS Attendance
      </button>
      <button class="card" onclick="openPage('documents')">
        Documents &amp; Payslips
      </button>
      <button class="card" onclick="openPage('customers')">
        Customers &amp; Invoices
      </button>
  <button class="card" onclick="openPage('salary')">
  Employee Salary
</button>

<button class="card" onclick="openPage('workhours')">
  Working Hours
</button>

<button class="card" onclick="openPage('owner')">
  Company Owner
</button>
  </section>
    <section id="page" class="panel">
      <h2 id="pageTitle"></h2>
      <div id="pageContent"></div>
      <button class="action" onclick="goHome()">
        ← Dashboard
      </button>
    </section>
  </main>

  <script>
    const pages = {
  employees: "Employees",
  sites: "Construction Sites",
  attendance: "GPS Attendance",
  documents: "Documents & Payslips",
  customers: "Customers & Invoices",
  salary: "Employee Salary",
  workhours: "Working Hours",
  owner: "Company Owner"
};
async function openPage(page) {
      document.getElementById("dashboard").style.display = "none";
      document.getElementById("page").style.display = "block";
      document.getElementById("pageTitle").textContent = pages[page];

      const content = document.getElementById("pageContent");
      content.innerHTML = "";
if (page === "salary") {
  const title = document.createElement("h3");
  title.textContent = "Employee Salary Management";
  content.appendChild(title);

  const info = document.createElement("p");
  info.textContent = "কর্মচারীদের বেতন লোড হচ্ছে...";
  content.appendChild(info);

  const { data: userData, error: authError } =
    await supabaseClient.auth.getUser();

  if (authError || !userData.user) {
    info.textContent = "প্রথমে লগইন করুন।";
    return;
  }

  const { data, error } = await supabaseClient
    .from("employee_salaries")
    .select("employee_id,salary_type,hourly_rate,monthly_salary,currency");

  if (error) {
    info.textContent = "বেতন লোড করা যায়নি: " + error.message;
    return;
  }

  info.textContent = "";

  if (!data || data.length === 0) {
    info.textContent = "এখনো কোনো বেতন নির্ধারণ করা হয়নি।";
  }

  data.forEach(salary => {
    const row = document.createElement("p");
    row.textContent =
      salary.salary_type === "hourly"
        ? `Hourly: €${salary.hourly_rate}/hour`
        : `Monthly: €${salary.monthly_salary}/month`;
    content.appendChild(row);
  });
const salaryButton = document.createElement("button");
salaryButton.textContent = "+ Add / Update Salary";
salaryButton.className = "action";

salaryButton.onclick = async () => {
  const employeeEmail = prompt("কর্মচারীর ইমেইল লিখুন:");
  if (!employeeEmail?.trim()) return;

  const type = prompt("বেতনের ধরন লিখুন: hourly অথবা monthly");
  if (!["hourly", "monthly"].includes(type)) {
    alert("hourly অথবা monthly লিখুন");
    return;
  }

  const amount = Number(prompt(
    type === "hourly"
      ? "ঘণ্টাপ্রতি বেতন (€) লিখুন:"
      : "মাসিক বেতন (€) লিখুন:"
  ));

  if (!Number.isFinite(amount) || amount < 0) {
    alert("সঠিক বেতনের পরিমাণ লিখুন");
    return;
  }

  const { data: employees, error: employeeError } =
    await supabaseClient
      .from("employees")
      .select("id")
      .eq("email", employeeEmail.trim())
      .limit(1);

  if (employeeError || !employees?.length) {
    alert("কর্মচারী পাওয়া যায়নি");
    return;
  }

  const { error } = await supabaseClient
    .from("employee_salaries")
    .upsert({
      employee_id: employees[0].id,
      salary_type: type,
      hourly_rate: type === "hourly" ? amount : 0,
      monthly_salary: type === "monthly" ? amount : 0,
      currency: "EUR"
    }, { onConflict: "employee_id" });

  if (error) {
    alert("বেতন সংরক্ষণ করা যায়নি: " + error.message);
  } else {
    alert("বেতন সফলভাবে সংরক্ষিত হয়েছে!");
    openPage("salary");
  }
};

  content.appendChild(salaryButton);
});
}

if (page === "workhours") {
  content.textContent = "Working Hours: Submit and Approve Hours";
}

if (page === "owner") {
  content.textContent = "Company Owner: Profile and Photo";
}

  if (page === "employees") {
  const info = document.createElement("p");
info.textContent = "কর্মচারীদের তালিকা লোড হচ্ছে...";
const addButton = document.createElement("button");
addButton.textContent = "+ Add Employee";
addButton.className = "action";

addButton.onclick = async () => {
  const name = prompt("কর্মচারীর পুরো নাম লিখুন:");
  if (!name || !name.trim()) return;

  const email = prompt("কর্মচারীর ইমেইল লিখুন:");
  if (!email || !email.trim()) return;

  const { error } = await supabaseClient
    .from("employees")
    .insert({
      full_name: name.trim(),
      email: email.trim(),
      role: "employee",
      active: true
    });
  if (error) {
    alert("কর্মচারী যোগ করা যায়নি: " + error.message);
  } else {
    alert("কর্মচারী সফলভাবে যোগ হয়েছে!");
    openPage("employees");
  }
};

content.appendChild(addButton);
 console.log("Add Employee button created"); 
  supabaseClient
  .from("employees")
  .select("*")
  .then(({ data, error }) => {
    if (error) {
      info.textContent = "তালিকা লোড করা যায়নি: " + error.message;
      return;
    }

    info.textContent = "";

    if (!data || data.length === 0) {
      info.textContent = "এখনো কোনো কর্মচারী নেই।";
      return;
    }

    data.forEach(employee => {
      const row = document.createElement("p");
      row.textContent = employee.full_name || employee.name || "কর্মচারী";
      content.appendChild(row);
    });
  });
  content.appendChild(info);
}
    else if (page === "attendance") {
        const info = document.createElement("p");
        info.textContent = "Check-in / Check-out (Demo)";
        content.appendChild(info);

        ["Inizia lavoro", "Termina lavoro"].forEach(label => {
          const button = document.createElement("button");
          button.className = "action";
          button.textContent = label;
          button.onclick = () => {
  if (!navigator.geolocation) {
    alert("এই ব্রাউজারে GPS সাপোর্ট নেই।");
    return;
  }

  navigator.geolocation.getCurrentPosition(
    () => {
      alert("GPS কাজ করছে! লোকেশন পাওয়া গেছে।");
    },
    (error) => {
      alert("GPS লোকেশন পাওয়া যায়নি। Error: " + error.message);
    },
    {
      enableHighAccuracy: true,
      timeout: 15000,
      maximumAge: 0
    }
  );
};
          content.appendChild(button);
        });
      
else if (
  page !== "salary" &&
  page !== "workhours" &&
  page !== "owner"
) {
  content.textContent = "এই বিভাগের কাজ পরবর্তী ধাপে যুক্ত করা হবে।";
}

    }

    function goHome() {
      document.getElementById("page").style.display = "none";
      document.getElementById("dashboard").style.display = "block";
    }

    async function loginUser() {
  const email = document.getElementById("loginEmail").value.trim();
  const password = document.getElementById("loginPassword").value;
  const message = document.getElementById("loginMessage");

  if (!email || !password) {
    message.textContent = "ইমেইল ও পাসওয়ার্ড লিখুন।";
    return;
  }

  message.textContent = "লগইন হচ্ছে...";

  const { data, error } =
    await supabaseClient.auth.signInWithPassword({
      email: email,
      password: password
    });

  if (error) {
    message.textContent = "লগইন ব্যর্থ: " + error.message;
    return;
  }
  if (data.user) {
    document.getElementById("dashboard").style.display = "block";
    message.textContent = "লগইন সফল!";
    document.getElementById("loginBox").style.display = "none";
  }
}
  </script>
</body>
</html>
