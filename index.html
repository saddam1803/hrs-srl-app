<script>
async function enableEmployeePush(button) {
  button.disabled = true;

  try {
    if (!("Notification" in window) ||
        !("serviceWorker" in navigator)) {
      throw new Error("Notifiche non supportate dal browser.");
    }

    const { data: sessionData, error: sessionError } =
      await supabaseClient.auth.getSession();

    if (sessionError || !sessionData.session) {
      throw new Error("Effettua nuovamente il login.");
    }

    const permission = await Notification.requestPermission();

    if (permission !== "granted") {
      throw new Error("Autorizza le notifiche nelle impostazioni del browser.");
    }

    const registration = await navigator.serviceWorker.register(
      "./firebase-messaging-sw.js"
    );

    await navigator.serviceWorker.ready;

    const token = await firebaseMessaging.getToken({
      vapidKey: "BHgfg2vkw2O8YzmTV0yaY9Esvujygp3pD8V-jtaZyBMQtMsg72e6AAjrQBA18hJ7gWyyR9BYSRwaqqK6ik23ZTY",
      serviceWorkerRegistration: registration
    });

    if (!token) throw new Error("Token non disponibile.");

    const { data, error } = await supabaseClient.functions.invoke(
      "hrs-save-employee-push-token-",
      {
        headers: {
          Authorization: "Bearer " + sessionData.session.access_token
        },
        body: { token }
      }
    );

    if (error || data?.success !== true) {
      throw new Error(error?.message || "Salvataggio non riuscito.");
    }

    button.textContent = "✓ Telefono registrato";
    alert("Telefono registrato per le notifiche.");
  } catch (error) {
    alert(error.message || "Registrazione non riuscita.");
  } finally {
    button.disabled = false;
  }
}

<script>
async function loadEmployeeNotifications() {
  const box = document.getElementById("employeeNotificationList");
  box.textContent = "Caricamento...";

  const { data: authData, error: authError } =
    await supabaseClient.auth.getUser();

  if (authError || !authData?.user) {
    box.textContent = "Effettua nuovamente il login.";
    return;
  }

  const { data, error } = await supabaseClient
    .from("employee_notifications")
    .select("id,message,is_read,created_at")
    .eq("employee_id", authData.user.id)
    .order("created_at", { ascending: false })
    .limit(50);

  if (error) {
    box.textContent = "Errore caricamento notifiche: " + error.message;
    return;
  }

  box.replaceChildren();

  if (!data?.length) {
    box.textContent = "Nessuna notifica.";
    return;
  }

  for (const item of data) {
    const card = document.createElement("div");
    card.className = "card";

    const text = document.createElement("p");
    text.textContent =
      (item.is_read ? "" : "🔵 ") + item.message + " — " +
      new Date(item.created_at).toLocaleString("it-IT");
    card.appendChild(text);

    if (!item.is_read) {
      const button = document.createElement("button");
      button.textContent = "Segna come letta";
      button.onclick = async () => {
        button.disabled = true;
        const { error: updateError } = await supabaseClient
          .from("employee_notifications")
          .update({ is_read: true })
          .eq("id", item.id)
          .eq("employee_id", authData.user.id);

        if (updateError) {
          alert(updateError.message);
          button.disabled = false;
          return;
        }

        await loadEmployeeNotifications();
      };
      card.appendChild(button);
    }

    box.appendChild(card);
  }
}
</script>

async function loadRequestStatus() {

    input.disabled = pending;

      pending: "Richiesta in attesa di approvazione.",
      approved: "Ultima richiesta approvata.",

    };
    status.textContent = data

// IBAN_INVIO
    form.onsubmit = async (event) => {
  event.preventDefault();
  if (send.disabled) return;

  const iban = input.value.replace(/\s/g, "").toUpperCase();
  if (!/^[A-Z]{2}[0-9]{2}[A-Z0-9]{11,30}$/.test(iban)
      || (iban.startsWith("IT") && iban.length !== 27)) {
    status.textContent = "Controlla il formato IBAN.";
    return;
  }

  let remainder = 0;
  for (const character of iban.slice(4) + iban.slice(0, 4)) {
    const digits = /[A-Z]/.test(character)
      ? String(character.charCodeAt(0) - 55) : character;
    for (const digit of digits) {
      remainder = (remainder * 10 + Number(digit)) % 97;
    }
  }
  if (remainder !== 1) {
    status.textContent = "IBAN non valido. Controlla le cifre.";
    return;
  }

  send.disabled = true;
  input.disabled = true;
  status.textContent = "Invio in corso…";

  try {
    const { error } = await supabaseClient
      .from("iban_change_requests")
      .insert({
        employee_id: employeeId,
        requested_iban: iban
      });
    if (error) throw error;

    input.value = "";
    input.type = "password";
    reveal.textContent = "Mostra IBAN";
    status.textContent = "Richiesta inviata. In attesa di approvazione.";
  } catch {
    await loadRequestStatus();
    if (!send.disabled) {
      status.textContent =
        "Invio non confermato. Controlla i dati prima di riprovare.";
    }
  }
};

async function loadSiteAttendance() {
  const today = new Intl.DateTimeFormat("sv-SE", {
    timeZone: "Europe/Rome",
    year: "numeric",
    month: "2-digit",
    day: "2-digit"
  });
  const date = today.format(new Date());

  // Read a window that covers the whole Italian calendar day.
  const utcMidnight = Date.parse(`${date}T00:00:00Z`);
  const from = new Date(utcMidnight - 2 * 3600000).toISOString();
  const until = new Date(utcMidnight + 24 * 3600000).toISOString();

  const [sitesResult, assignmentsResult, eventsResult] = await Promise.all([
    supabaseClient.from("sites")
      .select("id, name").eq("active", true).order("name"),
    supabaseClient.from("employee_sites")
      .select("site_id, employee_id, employees(full_name, active)"),
    supabaseClient.from("attendance")
      .select("site_id, employee_id, event_type, event_time")
      .gte("event_time", from).lt("event_time", until)
      .in("event_type", ["check_in", "check_out"])
      .order("event_time", { ascending: false })
      .order("id", { ascending: false })
  ]);

  const error = sitesResult.error || assignmentsResult.error || eventsResult.error;
  if (error) throw error;

  const latest = new Map();
  for (const event of eventsResult.data) {
    if (today.format(new Date(event.event_time)) !== date) continue;
    const key = `${event.site_id}/${event.employee_id}`;
    if (!latest.has(key)) latest.set(key, event.event_type);
  }

  attendanceList.replaceChildren();
  if (!sitesResult.data.length) {
    attendanceList.textContent = "Nessun cantiere attivo.";
    return;
  }

  for (const site of sitesResult.data) {
    const heading = document.createElement("h4");
    heading.textContent = site.name;
    attendanceList.append(heading);

    const assigned = assignmentsResult.data.filter(
      row => row.site_id === site.id && row.employees?.active === true
    );
    if (!assigned.length) {
      const message = document.createElement("p");
      message.textContent = "Nessun dipendente attivo assegnato.";
      attendanceList.append(message);
      continue;
    }

    const list = document.createElement("ul");
    for (const row of assigned) {
      const event = latest.get(`${site.id}/${row.employee_id}`);
      const status = event === "check_in" ? "Check-out da fare"
        : event === "check_out" ? "Check-out registrato"
        : "Nessuna timbratura oggi";
      const item = document.createElement("li");
      item.textContent = `${row.employees.full_name || "Dipendente"} — ${status}`;
      list.append(item);
    }
    attendanceList.append(list);
  }
}

          ? "Approvare e sostituire l’IBAN del dipendente?"

            }

            "Esito non confermato. Riapri Employees per verificare.";
          return;

      reject.onclick = () => review(false);

const toRad = n => n * Math.PI / 180;

const userLat = position.coords.latitude;
const userLon = position.coords.longitude;

const validSite = assignments.find(({ sites }) => {
  if (!sites || sites.active !== true) return false;

  const lat = sites.latitude;
  const lon = sites.longitude;
  const radius = sites.geofence_radius_m;

  if (lat == null || lon == null || radius == null) {
    return false;
  }

  const dLat = toRad(lat - userLat);
  const dLon = toRad(lon - userLon);

  const a =
    Math.sin(dLat / 2) ** 2 +
    Math.cos(toRad(userLat)) *
    Math.cos(toRad(lat)) *
    Math.sin(dLon / 2) ** 2;

  const distance = 2 * 6371000 *
    Math.asin(Math.min(1, Math.sqrt(a)));

  return distance <= radius;
});

    <p>
      <input name="password" type="password"
        placeholder="Nuova password" minlength="8"
        autocomplete="new-password" required>
    </p>
    <p>
      <input name="confirmPassword" type="password"
        placeholder="Conferma password" minlength="8"
        autocomplete="new-password" required>
    </p>
    <button class="action" type="submit">Salva password</button>
    <p role="status"></p>
  </form>
</section>

<script>
(() => {
  const box = document.getElementById("passwordResetBox");
  const form = document.getElementById("passwordResetForm");
  const button = form.querySelector("button");
  const status = form.querySelector('[role="status"]');

  function showReset() {
    for (const id of [
      "loginBox", "dashboard", "employeeDashboard", "page"
    ]) {
      const element = document.getElementById(id);
      if (element) element.style.display = "none";
    }
    box.style.display = "block";
  }

  const linkType = new URLSearchParams(
  location.hash.slice(1)
).get("type");

supabaseClient.auth.onAuthStateChange((event) => {
  if (
    event === "PASSWORD_RECOVERY" ||
    (
      (event === "SIGNED_IN" || event === "INITIAL_SESSION") &&
      linkType === "invite"
    )
  ) {
    showReset();
  }
});

if (linkType === "recovery" || linkType === "invite") {
  showReset();
}

  form.onsubmit = async (event) => {
    event.preventDefault();
    if (button.disabled) return;

    const password = form.elements.password.value;
    if (password !== form.elements.confirmPassword.value) {
      status.textContent = "Le password non coincidono.";
      return;
    }

    button.disabled = true;
    status.textContent = "Salvataggio...";
    try {
      const { error } = await supabaseClient.auth.updateUser({
        password
      });
      if (error) throw error;

      form.reset();
      status.textContent = "Password salvata. Riapri l’app e accedi.";
      await supabaseClient.auth.signOut({ scope: "local" });
      history.replaceState(null, "", location.pathname);
    } catch (error) {
      status.textContent = "Errore: " + error.message;
      button.disabled = false;
    }
  };
})();
</script>
